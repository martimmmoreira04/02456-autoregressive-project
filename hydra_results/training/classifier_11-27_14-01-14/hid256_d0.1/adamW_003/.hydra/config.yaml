frozen_weights: weights/transformer_best.pt
model_layout:
  hidden_units: 256
  dropout: 0.1
training_parameters:
  epochs: 30
  batch_size: 32
  seed: 42
  hyper_run: adamW_003
  optimizer: ${Hyper[${training_parameters.hyper_run}].optimizer}
  lr: ${Hyper[${training_parameters.hyper_run}].lr}
hardware: cuda
Hyper:
  adam_001:
    optimizer: Adam
    lr: 0.001
  adam_003:
    optimizer: Adam
    lr: 0.003
  adamW_003:
    optimizer: AdamW
    lr: 0.003
  adamW_005:
    optimizer: AdamW
    lr: 0.005
