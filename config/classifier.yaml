#PYTHONPATH=src uv run python scripts/Guidance/classifier_train.py \--config-name=classifier hardware=mps training_parameters.epochs=1

frozen_weights: weights/transformer_best.pt

model_layout:
  hidden_units: 128
  dropout: 0.1

training_parameters:
  epochs: 30
  batch_size: 32
  seed: 42
  hyper_run: adamW_003
  optimizer: ${Hyper[${training_parameters.hyper_run}].optimizer}
  lr:        ${Hyper[${training_parameters.hyper_run}].lr}

hardware:  mps     # 'cuda' on HPC

Hyper:
  adam_001:
    optimizer: Adam
    lr: 0.001

  adam_003:
    optimizer: Adam
    lr: 0.003

  adamW_003:
    optimizer: AdamW
    lr: 0.003

  adamW_005:
    optimizer: AdamW
    lr: 0.005

hydra:
  sweep:
    dir: hydra_results/training/classifier_${now:%m-%d_%H-%M-%S}
    subdir: hid${model_layout.hidden_units}_d${model_layout.dropout}/${training_parameters.hyper_run}
  sweeper:
    params:
      model_layout.hidden_units: 64,128,256
      model_layout.dropout: 0.0,0.1,0.3
      training_parameters.hyper_run: adamW_003,adamW_005,adam_003,adam_001