# Martim R - based on the MLP_train_sweep
# run with 
#         PYTHONPATH=src uv run python scripts/transformer/transformer_train.py --config-name=transformer_train_sweep_r2 -m
# make sure the command is run from repository root!! either when done manually and when done on hpc. 

# model structure.
model_layout:
  embedding_size: 24
  dropout: 0.1
  num_heads:      4
  num_layers:     2

# unchanged hyperparameters
training_parameters:
  epochs: 30 
  batch_size: 32
  seed: 42
  hyper_run: adamW_003
  optimizer: ${Hyper[${training_parameters.hyper_run}].optimizer}
  lr:        ${Hyper[${training_parameters.hyper_run}].lr}

# specify hardware!! 
# just so we can use the GPU's and not wait so much 
  # 'cuda' for nvidia GPU's 
  # 'mps' for apple 
hardware: mps

Hyper:
  #ADAM OPTIMIZERS
  adam_005:
    optimizer: Adam
    lr: 0.005

  adam_01:
    optimizer: Adam
    lr: 0.01

  adam_003:
    optimizer: Adam
    lr: 0.003
    
  #ADAM_W OPTIMIZERS
  adamW_003:
    optimizer: AdamW
    lr: 0.003

  adamW_005:
    optimizer: AdamW
    lr: 0.005

  adamW_01:
    optimizer: AdamW
    lr: 0.01

# OUTPUT PATH 
#     - this creates a folder of the date and time for the run initialized. 
#     - then it creates a folder with results for each run inside. 
hydra:
  sweep:
    dir: hydra_results/training/transformer_train_sweep_r2_${now:%m-%d_%H-%M-%S}
    subdir: emb${model_layout.embedding_size}_h${model_layout.num_heads}_L${model_layout.num_layers}_d${model_layout.dropout}/${training_parameters.hyper_run}
  sweeper:
    params:
      training_parameters.hyper_run: adamW_003,adamW_005,adamW_01,adam_003,adam_005,adam_01
      model_layout.embedding_size: 128,256
      model_layout.num_layers: 4,6
      model_layout.dropout: 0.1,0.2,0.3
