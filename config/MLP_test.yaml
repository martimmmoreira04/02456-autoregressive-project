# uv run python scripts/MLP_test.py --config-name=MLP_test

# path to weights!!!
weights: 

# specify hardware!! 
# just so we can use the GPU's and not wait so much 
  # 'cuda' for nvidia GPU's 
  # 'mps' for apple 
hardware: cuda

test_data: data/test.csv
batch_size: 32

hydra:
  run:
    dir: hydra_results/test/MLP_${now:%m-%d_%H-%M-%S}