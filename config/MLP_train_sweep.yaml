# run with 
#         PYTHONPATH=src uv run python scripts/MLP/MLP_train.py --config-name=MLP_train_sweep -m
# make sure the command is run from repository root!! either when done manually and when done on hpc. 


# model structure.
model_layout:
  num_hidden: 128  # nerurons not layers

# unchanged hyperparameters
training_parameters:
  epochs: 20
  batch_size: 32
  seed: 42    #hitchikers guide to the galaxy yo
  optimizer: ${Hyper[${training_parameters.hyper_run}].optimizer}
  lr: ${Hyper[${training_parameters.hyper_run}].lr}

# specify hardware!! 
# just so we can use the GPU's and not wait so much 
  # 'cuda' for nvidia GPU's 
  # 'mps' for apple 
hardware: mps


Hyper:
  
  #SGD OPTIMIZERS 
  sgd_001:
    optimizer: SGD
    lr: 0.01

  sgd_005:
    optimizer: SGD
    lr: 0.05

  sgd_01:
    optimizer: SGD
    lr: 0.1

  #ADAM OPTIMIZERS
  adam_0003:
    optimizer: Adam
    lr: 0.0003

  adam_001:
    optimizer: Adam
    lr: 0.001

  adam_003:
    optimizer: Adam
    lr: 0.003


# OUTPUT PATH 
#     - this creates a folder of the date and time for the run initialized. 
#     - then it creates a folder with results for each run inside. 

hydra:
  sweep:
    dir: hydra_results/training/MLP_train_sweep_${now:%m-%d_%H-%M-%S}
    subdir: ${model_layout.num_hidden}/${training_parameters.hyper_run}
  sweeper:
    params:
      +training_parameters.hyper_run: "sgd_001,sgd_005,sgd_01,adam_0003,adam_001,adam_003"
      model_layout.num_hidden: "64,128,256"